<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Healthy Bites | Fresh Salads & Healthy Food Delivered</title>
    <meta
      name="description"
      content="Healthy Bites — Fresh Bites, Healthy Delights. Order fresh salads and healthy meals online for fast delivery. Eat clean, feel great."
    />
    <meta name="keywords" content="healthy food, fresh salads, salad delivery, healthy meals, order salad online, Healthy Bites" />
    <meta name="author" content="Healthy Bites" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://healthy-bites-app.vercel.app/" />

    <!-- Favicon & theme -->
    <link rel="icon" type="image/png" href="/assets/logo/healthy-bites-logo.png" />
    <link rel="apple-touch-icon" href="/assets/logo/healthy-bites-logo.png" />
    <meta name="theme-color" content="#2ECC71" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Healthy Bites" />
    <meta property="og:title" content="Healthy Bites | Fresh Salads & Healthy Food Delivered" />
    <meta
      property="og:description"
      content="Fresh Bites, Healthy Delights. Order fresh salads and healthy meals online for fast delivery."
    />
    <meta property="og:url" content="https://healthy-bites-app.vercel.app/" />
    <meta property="og:image" content="https://healthy-bites-app.vercel.app/assets/logo/healthy-bites-logo.png" />
    <meta property="og:image:alt" content="Healthy Bites logo" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Healthy Bites | Fresh Salads & Healthy Food Delivered" />
    <meta
      name="twitter:description"
      content="Fresh Bites, Healthy Delights. Order fresh salads and healthy meals online for fast delivery."
    />
    <meta name="twitter:image" content="https://healthy-bites-app.vercel.app/assets/logo/healthy-bites-logo.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Healthy Bites",
        "slogan": "Fresh Bites, Healthy Delights",
        "url": "https://healthy-bites-app.vercel.app/",
        "logo": "https://healthy-bites-app.vercel.app/assets/logo/healthy-bites-logo.png",
        "image": "https://healthy-bites-app.vercel.app/assets/images/hero-bg.png",
        "servesCuisine": ["Healthy", "Salads", "Bowls"],
        "priceRange": "$$",
        "acceptsReservations": "False"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Healthy Bites",
        "url": "https://healthy-bites-app.vercel.app/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
